_target_: ctforams.data.datamodule.CTForamsDataModule

defaults:
  - dataset@train_data: ctforams.yaml
  - dataset@val_data: ctforams.yaml
  - dataset@test_data: ctforams.yaml
  - augmentation: default.yaml

batch_size: 1
num_workers: 0
pin_memory: false
crop_size: ${crop_size}

train_data:
  hdf5_path: ${paths.data_dir}/${hdf5_name}
  group_name: train
  training: true
val_data:
  hdf5_path: ${paths.data_dir}/${hdf5_name}
  group_name: val
test_data:
  hdf5_path: ${paths.data_dir}/${hdf5_name}
  group_name: test
